<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Smooth gradient background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#282B27"/>
      <stop offset="100%" stop-color="#181917"/>
    </linearGradient>
    <!-- Lime glow gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7F982"/>
      <stop offset="100%" stop-color="#8BCF5B"/>
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#ECE9DF" stroke-width="8" stroke-opacity="0.15"/>
  
  <!-- Stylized Monogram Y -->
  <path d="M 136 136 L 256 268 L 376 136" fill="none" stroke="url(#limeGrad)" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 256 268 L 256 376" fill="none" stroke="url(#limeGrad)" stroke-width="54" stroke-linecap="round"/>
  
  <!-- Code/Terminal Active Dot Accent -->
  <circle cx="360" cy="360" r="28" fill="#8BCF5B"/>
  <circle cx="360" cy="360" r="40" fill="#8BCF5B" fill-opacity="0.25"/>
</svg>
